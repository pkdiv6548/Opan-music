<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="auraGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0d14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="auraShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="#0b0d14" />
  <rect width="512" height="512" rx="112" fill="url(#auraGlow)" />

  <!-- Outer Resonance Halo -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#312e81" stroke-width="3" stroke-dasharray="6 8" opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#4338ca" stroke-width="2" opacity="0.5" />

  <!-- Central Aura Sound Resonance Glyphs -->
  <g filter="url(#auraShadow)">
    <!-- Harmonic Soundwave Columns -->
    <rect x="156" y="210" width="16" height="92" rx="8" fill="url(#waveGrad2)" opacity="0.8" />
    <rect x="196" y="170" width="16" height="172" rx="8" fill="url(#waveGrad1)" />
    <rect x="236" y="130" width="16" height="252" rx="8" fill="url(#waveGrad1)" />
    <rect x="276" y="160" width="16" height="192" rx="8" fill="url(#waveGrad1)" />
    <rect x="316" y="200" width="16" height="112" rx="8" fill="url(#waveGrad2)" opacity="0.85" />
    <rect x="356" y="235" width="16" height="42" rx="8" fill="url(#waveGrad2)" opacity="0.6" />

    <!-- Organic Orbit Ring -->
    <path d="M 120 256 A 136 136 0 0 1 392 256" fill="none" stroke="url(#waveGrad1)" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <circle cx="392" cy="256" r="8" fill="#38bdf8" />
  </g>
</svg>
